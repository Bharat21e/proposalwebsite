<!DOCTYPE html>
<html lang="en">
<head>
    <title>Accepted ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            text-align: center;
        }

        .box {
            background: rgba(255,255,255,0.2);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 20px;
        }

        .heart {
            font-size: 50px;
            animation: beat 1s infinite;
        }

        @keyframes beat {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="heart">❤️</div>
        <h1>Proposal Accepted!</h1>
        <p id="msg"></p>
    </div>

    <script>
        let username = localStorage.getItem("username");

        document.getElementById("msg").innerText =
            "Thank you " + username + " for accepting ❤️";
    </script>

</body>
</html>
